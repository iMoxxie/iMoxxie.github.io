<style>
/* Layout: uma coluna estreita de app (celular primeiro). No computador, as telas de
   orçamento ganham uma segunda coluna com a folha do documento ao vivo.
   Visual "bancada": fundo cal, grafite, amarelo trena como único destaque. */
:root{
  --bg:#EEF0EB;          /* cal */
  --surface:#FFFFFF;
  --well:#E1E5DE;        /* bancada: áreas rebaixadas */
  --ink:#1C2228;         /* grafite */
  --ink-soft:#5B6470;    /* pedra */
  --line:#DCE0DA;
  --line-strong:#C5CBC3;
  --accent:#F5B800;      /* amarelo trena */
  --accent-soft:#FFF4CC;
  --accent-ink:#7A5A00;
  --on-accent:#1C2228;
  --bar:#1C2228;
  --on-bar:#FFFFFF;
  --on-bar-soft:#B9C1BC;
  /* cores de estado (semânticas, não são o destaque) */
  --st-neg:#B4632A; --st-apr:#2F7A4F; --st-exe:#2B5B8C; --st-fin:#5B6470; --st-per:#B3261E;
  --danger:#B3261E; --danger-soft:#FBEAE8; --ok:#2F7A4F; --ok-soft:#E5F1EA;
  --wa:#2F7A4F;
  /* folha de papel: igual nos dois temas, porque é o que o cliente recebe */
  --paper:#FFFFFF; --paper-ink:#1C2228; --paper-soft:#5B6470; --paper-line:#DCE0DA; --paper-well:#F6F7F4;
  --paper-accent:#F5B800; --paper-accent-soft:#FFF4CC;
  --shadow:0 1px 2px rgba(28,34,40,.06), 0 6px 18px -8px rgba(28,34,40,.18);
  --display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  --text:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13171A; --surface:#1C2226; --well:#171C1F; --ink:#ECEFEA; --ink-soft:#A3ACA6;
    --line:#2A3237; --line-strong:#3B454B; --accent:#F5B800; --accent-soft:#3A3112; --accent-ink:#F5CF5A;
    --on-accent:#1C2228; --bar:#0C0F11; --on-bar:#ECEFEA; --on-bar-soft:#A3ACA6;
    --st-neg:#E08A4E; --st-apr:#5DB585; --st-exe:#6A9BD1; --st-fin:#A3ACA6; --st-per:#E5675E;
    --danger:#E5675E; --danger-soft:#3A1F1D; --ok:#5DB585; --ok-soft:#1B3326; --wa:#2F7A4F;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13171A; --surface:#1C2226; --well:#171C1F; --ink:#ECEFEA; --ink-soft:#A3ACA6;
  --line:#2A3237; --line-strong:#3B454B; --accent:#F5B800; --accent-soft:#3A3112; --accent-ink:#F5CF5A;
  --on-accent:#1C2228; --bar:#0C0F11; --on-bar:#ECEFEA; --on-bar-soft:#A3ACA6;
  --st-neg:#E08A4E; --st-apr:#5DB585; --st-exe:#6A9BD1; --st-fin:#A3ACA6; --st-per:#E5675E;
  --danger:#E5675E; --danger-soft:#3A1F1D; --ok:#5DB585; --ok-soft:#1B3326; --wa:#2F7A4F;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{min-height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--text); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
[hidden]{display:none!important;}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em;}
.num{font-variant-numeric:tabular-nums;}
.ico{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}

/* ---------- casca ---------- */
#app{max-width:640px;margin:0 auto;padding-bottom:110px;}
#app.wide{max-width:1240px;}
.cols{display:block;}
.cols > .main{min-width:0;}
.cols > .side{display:none;}
@media (min-width:1000px){
  #app.wide .cols{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:28px;align-items:start;}
  #app.wide .cols > .side{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);padding-top:16px;padding-bottom:16px;padding-right:max(16px, env(safe-area-inset-right,0px));max-height:calc(100vh - 76px - env(safe-area-inset-top,0px));overflow-y:auto;}
  #app.wide .only-mobile{display:none!important;}
}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:8px;min-height:60px;
  padding-block:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);
}
.topbar .titles{flex:1;min-width:0;}
.topbar h1{font-size:19px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .sub{margin-top:1px;}
.icon-btn{
  width:40px;height:40px;border-radius:10px;border:none;background:none;color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 40px;
}
.icon-btn:hover{background:var(--well);}
.content{display:flex;flex-direction:column;gap:12px;padding-block:16px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));}
.sub{color:var(--ink-soft);font-size:13px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.card-head h2{font-size:16px;font-weight:600;}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);}
.row{display:flex;gap:10px;}
.row > *{flex:1;min-width:0;}
@media (max-width:420px){ .row.stack{flex-direction:column;gap:0;} }

/* ---------- campos ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-top:12px;}
.field:first-child{margin-top:0;}
.row > .field{margin-top:12px;}
.row:first-child > .field{margin-top:0;}
@media (max-width:420px){ .row.stack > .field + .field{margin-top:12px;} }
.field > label, .lbl{font-size:13px;color:var(--ink-soft);font-weight:500;}
input[type=text],input[type=tel],input[type=email],input[type=search],input[type=datetime-local],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:9px;
  background:var(--surface);font-size:16px;transition:border-color .12s, box-shadow .12s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent);}
input::placeholder,textarea::placeholder{color:var(--ink-soft);opacity:.65;}
textarea{min-height:76px;resize:vertical;line-height:1.45;}
.hint{font-size:12.5px;color:var(--ink-soft);margin:6px 0 0;}
.timefields{display:flex;align-items:center;gap:6px;}
.timefields input{width:58px;text-align:center;padding:11px 4px;}
.money-in{position:relative;}
.money-in::before{content:"R$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:15px;pointer-events:none;}
.money-in input{padding-left:38px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;}
.toggle-row > span{font-size:14.5px;}
.switch{position:relative;width:46px;height:28px;flex:0 0 46px;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1;}
.slider{position:absolute;inset:0;background:var(--line-strong);border-radius:20px;transition:.15s;}
.slider::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch input:checked + .slider{background:var(--ink);}
.switch input:checked + .slider::before{transform:translateX(18px);background:var(--accent);}
.switch input:focus-visible + .slider{outline:2px solid var(--ink);outline-offset:2px;}
.seg{display:flex;background:var(--well);border-radius:10px;padding:3px;gap:3px;margin-top:12px;}
.seg button{flex:1;padding:9px 8px;border:none;background:none;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-soft);}
#s-hmodo-horario,#s-hmodo-estimado{margin-top:12px;}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(28,34,40,.15);}

/* ---------- botões ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 16px;border-radius:11px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;text-decoration:none;
}
.btn:hover{border-color:var(--ink);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:700;font-size:16px;}
.btn-primary:hover{filter:brightness(1.06);border-color:var(--accent);}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.btn-danger{background:none;border-color:var(--danger);color:var(--danger);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:9px;}
.btn:disabled{opacity:.55;cursor:wait;}
.btn-dashed{border-style:dashed;background:none;font-weight:500;}
.btn-dashed:hover{background:var(--surface);}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;}
.btn-group > .btn{flex:1 1 140px;}
.link{background:none;border:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong);padding:4px 0;font-size:13.5px;}
.link.danger{color:var(--danger);}
.fab{
  position:fixed;z-index:25;width:58px;height:58px;border-radius:18px;border:none;
  right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px -6px rgba(28,34,40,.45);
}
.fab .ico{width:26px;height:26px;stroke-width:2.2;}

/* ---------- início ---------- */
.brand{display:flex;align-items:center;gap:10px;}
.brand svg{width:34px;height:34px;flex:0 0 34px;}
.brand .word{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.03em;}
.hero-actions{display:grid;grid-template-columns:1fr;gap:10px;}
.big-action{
  display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
.big-action:hover{border-color:var(--ink);}
.big-action.primary{background:var(--bar);border-color:var(--bar);color:var(--on-bar);border-top:3px solid var(--accent);}
.big-action .ico{width:26px;height:26px;}
.big-action .t{font-family:var(--display);font-weight:700;font-size:17px;display:block;}
.big-action .d{font-size:13px;opacity:.75;display:block;margin-top:1px;}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.navcard{
  display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;
  padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
.navcard:hover{border-color:var(--ink);}
.navcard.wide{grid-column:1 / -1;}
.navcard .lbl2{font-weight:600;font-size:15px;}
.navcard .sub{margin-top:-6px;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{padding:14px;border-radius:14px;background:var(--well);}
.stat .v{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.02em;margin-top:2px;}

/* ---------- estado do orçamento ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--well);color:var(--ink);white-space:nowrap;}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);}
.st-negociacao{--c:var(--st-neg);} .st-aprovado{--c:var(--st-apr);} .st-execucao{--c:var(--st-exe);}
.st-finalizado{--c:var(--st-fin);} .st-perdido{--c:var(--st-per);}
.orc-list{display:flex;flex-direction:column;gap:8px;}
.orc-card{
  display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;
  padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
.orc-card:hover{border-color:var(--ink);}
.orc-card .n{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink-soft);}
.orc-card .c{font-weight:600;font-size:16px;grid-column:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.orc-card .p{font-size:13px;color:var(--ink-soft);grid-column:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.orc-card .v{font-family:var(--display);font-weight:700;font-size:17px;grid-column:2;grid-row:2;text-align:right;align-self:center;}
.orc-card .pill{grid-column:2;grid-row:1;justify-self:end;}
.orc-card .warn{grid-column:1 / -1;font-size:12.5px;color:var(--danger);margin-top:4px;}
.filterbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:0 -2px;scrollbar-width:none;}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink);}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.search{position:relative;}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);width:18px;height:18px;}
.search input{padding-left:38px;}

/* ---------- linhas de itens ---------- */
.items{display:flex;flex-direction:column;}
.item-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.item-row:last-child{border-bottom:none;}
.item-row > div:first-child{min-width:0;flex:1;}
.item-main{font-weight:600;overflow-wrap:anywhere;}
.item-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;overflow-wrap:anywhere;}
.item-val{font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;}
.item-links{display:flex;gap:12px;justify-content:flex-end;margin-top:2px;}
.empty{color:var(--ink-soft);font-size:14px;padding:6px 0;}
.empty-big{text-align:center;color:var(--ink-soft);padding:40px 12px;font-size:14.5px;}
.sum-line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:15px;}
.sum-line .num{font-weight:600;}
.sum-line.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:700;font-size:17px;}
.sum-line.total .num{font-family:var(--display);font-size:20px;}
.progress{height:6px;border-radius:6px;background:var(--well);overflow:hidden;margin:8px 0 4px;}
.progress > span{display:block;height:100%;background:var(--ok);}

/* ---------- barra fixa do formulário ---------- */
.action-bar{
  position:sticky;bottom:0;z-index:15;background:var(--bar);color:var(--on-bar);border-top:3px solid var(--accent);
  padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
}
.action-bar .tl{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;}
.action-bar .tl .l{font-size:13.5px;color:var(--on-bar-soft);}
.action-bar .tl .big{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;}
.action-bar .btns{display:flex;gap:8px;}
.action-bar .btns .btn-primary{flex:1;}
.btn-on-bar{background:none;border:1px solid var(--on-bar-soft);color:var(--on-bar);}
.btn-on-bar:hover{border-color:var(--on-bar);}
#app.has-bar{padding-bottom:0;}

/* ---------- contato ---------- */
.contact-row{display:flex;gap:8px;margin-top:12px;}
.contact-row .btn{flex:1;}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff;}
.btn-wa:hover{border-color:var(--wa);filter:brightness(1.08);}
.warn-box{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;}
.reminder{border-radius:10px;padding:10px 12px;background:var(--well);display:flex;flex-direction:column;gap:4px;}
.reminder .tag{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.reminder.late{background:var(--danger-soft);} .reminder.late .tag{color:var(--danger);}
.reminder.done{background:var(--ok-soft);} .reminder.done .tag{color:var(--ok);}
.reminder.sched .tag{color:var(--accent-ink);}
/* ---------- agenda ---------- */
.wk-nav{display:flex;align-items:center;gap:6px;}
.wk-nav .btn-mes{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13.5px;}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.wk-day{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:7px 0 6px;text-align:center;font-size:12px;color:var(--ink-soft);min-width:0;}
.wk-day b{display:block;font-family:var(--display);font-size:17px;color:var(--ink);line-height:1.2;}
.wk-day i{display:block;width:5px;height:5px;border-radius:50%;margin:3px auto 0;background:transparent;}
.wk-day.has i{background:var(--ink);}
.wk-day.hoje b{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:3px;}
.wk-day.on{background:var(--ink);border-color:var(--ink);color:var(--bg);}
.wk-day.on b{color:var(--bg);}
.wk-day.on.has i{background:var(--bg);}

// ---------------- utilidades ----------------
const $ = id => document.getElementById(id);

function fmtMoney(v){ v = Number(v) || 0; return "R$ " + v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtNum(v){ return (Number(v) || 0).toLocaleString('pt-BR', {maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return ""; return new Date(d).toLocaleDateString('pt-BR'); }
function fmtDateTime(d){ if(!d) return ""; const dt = new Date(d); return dt.toLocaleDateString('pt-BR') + " às " + dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }
function nowISO(){ return new Date().toISOString(); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function onlyDigits(s){ return String(s || '').replace(/\D/g, ''); }
function clone(o){ return o == null ? o : JSON.parse(JSON.stringify(o)); }
// aceita "10,50", "1.234,56" e "10.5"
function parseNum(s){
  if(typeof s === 'number') return s;
  s = String(s || '').trim().replace(/\s|R\$/g, '');
  if(!s) return 0;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return isFinite(n) ? n : 0;
}
// número para mostrar dentro de um campo (vírgula decimal)
function numIn(v){ if(v === '' || v == null || Number(v) === 0) return ''; return String(Number(v)).replace('.', ','); }
// data ISO -> valor do campo datetime-local no horário local (o original mostrava em UTC)
function maskPhone(v){
  v = onlyDigits(v).slice(0, 11);
  if(v.length > 10) return v.replace(/^(\d\d)(\d{5})(\d{4}).*/, "($1) $2-$3");
  if(v.length > 6)  return v.replace(/^(\d\d)(\d{4})(\d{0,4}).*/, "($1) $2-$3");
  if(v.length > 2)  return v.replace(/^(\d\d)(\d{0,5})/, "($1) $2");
  if(v.length > 0)  return v.replace(/^(\d*)/, "($1");
  return v;
}
function waNumber(tel){
  const d = onlyDigits(tel);
  if(d.length === 10 || d.length === 11) return '55' + d;
  if(d.startsWith('55') && (d.length === 12 || d.length === 13)) return d;
  return d.length >= 8 ? d : '';
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
async function salvando(fn, erroMsg){
  try { return await fn(); }
  catch(e){ console.error(e); toast((erroMsg || 'Não foi possível salvar.') + ' ' + (e && e.message ? '(' + e.message + ')' : '')); throw e; }
}

// ---------------- banco local (mesma "forma" do banco do Claude) ----------------
// Assim o resto do app usa db.collection(...).add/doc().set/update/delete/onSnapshot
// sem saber se está na nuvem ou no navegador.
function createLocalDb(){
  let data = {};
  try { data = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}') || {}; } catch(e){ data = {}; }
  const listeners = new Set();
  function persist(){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); }
    catch(e){
      try { data = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}') || {}; } catch(_){}
      throw new Error('o navegador não deixou guardar (espaço cheio ou bloqueado). Baixe um backup em Configurações.');
    }
  }
  function snapDoc(c, id){ const d = data[c] && data[c][id]; return { id, exists: !!d, data: () => d ? clone(d) : undefined, metadata:{fromCache:false, hasPendingWrites:false} }; }
  function fire(l){
    if(l.doc) l.cb(snapDoc(l.c, l.id));
    else { const col = data[l.c] || {}; const docs = Object.keys(col).map(id => snapDoc(l.c, id)); l.cb({docs, size:docs.length, empty:!docs.length, metadata:{fromCache:false, hasPendingWrites:false}}); }
  }
  function notify(){ setTimeout(() => listeners.forEach(fire), 0); }
  function docRef(c, id){
    return {
      id, path: c + '/' + id,
      async get(){ return snapDoc(c, id); },
      async set(d){ (data[c] = data[c] || {})[id] = clone(d); persist(); notify(); },
      async update(d){ if(!data[c] || !data[c][id]) throw new Error('documento não existe'); Object.assign(data[c][id], clone(d)); persist(); notify(); },
      async delete(){ if(data[c]) delete data[c][id]; persist(); notify(); },
      onSnapshot(cb){ const l = {doc:true, c, id, cb}; listeners.add(l); setTimeout(() => fire(l), 0); return () => listeners.delete(l); },
    };
  }
  return {
    doc(path){ const [c, id] = path.split('/'); return docRef(c, id); },
    collection(c){
      return {
        path: c,
        doc: id => docRef(c, id || uid()),
        async add(d){ const r = docRef(c, uid()); await r.set(d); return r; },
        onSnapshot(cb){ const l = {doc:false, c, cb}; listeners.add(l); setTimeout(() => fire(l), 0); return () => listeners.delete(l); },
      };
    },
  };
}

// ---------------- inicialização ----------------
let LOADED = new Set(), LOAD_TIMER = null, LOAD_SLOW = false;
const NEEDED = ['clientes','catalogoServicos','catalogoMateriais','orcamentos','compromissos','config'];
async function boot(){
  let cloud = null;
  if(window.claude && typeof window.claude.use === 'function'){
    try { cloud = await window.claude.use("db"); } catch(e){ cloud = null; }
    try { downloadsCap = await window.claude.use("downloads"); } catch(e){ downloadsCap = null; }
    if(cloud){ try { assetsCap = await window.claude.use("assets"); } catch(e){ assetsCap = null; } }
  }
  db = cloud || createLocalDb();
  MODO = cloud ? 'nuvem' : 'local';
  LOAD_TIMER = setTimeout(() => { LOAD_SLOW = true; if(LOADED.size < NEEDED.length) renderLoading(); }, 10000);
  sub("clientes", d => STATE.clientes = d);
  sub("catalogoServicos", d => STATE.catServicos = d);
  sub("catalogoMateriais", d => STATE.catMateriais = d);
  sub("orcamentos", d => STATE.orcamentos = d);
  sub("compromissos", d => STATE.compromissos = d);
  db.doc("config/empresa").onSnapshot(snap => {
    STATE.config = snap.exists ? snap.data() : {};
    prepararLogo();
    loaded('config');
  }, err => { console.error(err); loaded('config'); });
}
function sub(path, assign){
  db.collection(path).onSnapshot(snap => {
    const o = {};
    snap.docs.forEach(doc => { o[doc.id] = Object.assign({}, doc.data(), {id: doc.id}); });
    assign(o);
    loaded(path);
  }, err => { console.error(path, err); toast('Não foi possível ler os dados (' + path + ').'); loaded(path); });
}
function loaded(name){
  const first = !LOADED.has(name);
  LOADED.add(name);
  if(LOADED.size < NEEDED.length) return;
  if(LOAD_TIMER){ clearTimeout(LOAD_TIMER); LOAD_TIMER = null; }
  if(first && LOADED.size === NEEDED.length && !VIEW.started){ VIEW.started = true; render(); return; }
  dataChanged();
}
function renderLoading(){

// ---------------- contas ----------------
function calcHoras(inicio, fim, pausaMin){
  if(!inicio || !fim) return {minutos:0, horasDecimais:0, label:"00:00"};
  const [ih, im] = inicio.split(":").map(Number);
  const [fh, fm] = fim.split(":").map(Number);
  let total = (fh*60 + fm) - (ih*60 + im);
  if(total < 0) total += 24*60;           // passou da meia-noite
  total -= (Number(pausaMin) || 0);
  if(total < 0) total = 0;
  const h = Math.floor(total/60), m = total % 60;
  return { minutos: total, horasDecimais: total/60, label: String(h).padStart(2,'0') + ":" + String(m).padStart(2,'0') };
}
function horasLabel(h){ const tot = Math.round(h*60); return String(Math.floor(tot/60)).padStart(2,'0') + ':' + String(tot % 60).padStart(2,'0'); }
function matUnitFinal(m){
  const v = Number(m.valorUnit) || 0, mv = Number(m.margemValor) || 0;
  if(!m.margemTipo) return cents(v);
  return cents(m.margemTipo === 'pct' ? v * (1 + mv/100) : v + mv);
}
function orcTotal(o){
  const ts = cents((o.servicos || []).reduce((s, i) => s + Number(i.valorTotal || 0), 0));
  const tm = cents((o.materiais || []).reduce((s, i) => s + Number(i.valorTotal || 0), 0));
  const recebido = cents((o.recibos || []).reduce((s, r) => s + Number(r.valor || 0), 0));
  return { totalServicos: ts, totalMateriais: tm, total: cents(ts + tm), recebido, aReceber: cents(ts + tm - recebido) };
}
function foraDaGarantia(o){
  if(o.status !== 'finalizado' || !o.finalizadoEm) return false;
  const dias = (Date.now() - new Date(o.finalizadoEm).getTime()) / 86400000;
  return dias > (o.garantiaDias || 90);
}
function lembreteEstado(l){
  if(!l || !l.data) return null;
  if(l.concluido) return 'done';
  const d = new Date(l.data), now = new Date();
  if(d < now) return 'late';
  if(d.toDateString() === now.toDateString()) return 'today';
  return 'sched';
}
// ---------------- agenda: datas e dados ----------------
// O dia é guardado como texto 'AAAA-MM-DD' na data LOCAL (nada de toISOString, que usa UTC
// e muda o dia depois das 21h em São Paulo). O horário fica em 'HH:MM' ou ''.
// orcamento.agenda = {inicio, fim, hora} | null; STATE.compromissos = {id: {tipo:'compromisso'|'cobranca', titulo, data, hora, orcamentoId, concluido, criadoEm}}
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEMANA = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const p2 = n => String(n).padStart(2, '0');
function diaDe(d){ return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function diaHoje(){ return diaDe(new Date()); }
function dataDoDia(dia){ const [a, m, d] = String(dia).split('-').map(Number); return new Date(a, m - 1, d, 12); } // meio-dia: não escorrega
function somarDias(dia, n){ const d = dataDoDia(dia); d.setDate(d.getDate() + n); return diaDe(d); }
function diasEntre(a, b){ return Math.round((dataDoDia(b) - dataDoDia(a)) / 86400000) + 1; }
function inicioSemana(dia){ return somarDias(dia, -dataDoDia(dia).getDay()); }
function fmtDiaLongo(dia){ const d = dataDoDia(dia); return SEMANA[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()]; }
function fmtDiaCurto(dia){ const d = dataDoDia(dia); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1); }

// número: AAAAMM-N, sempre o maior do mês + 1 (o original contava e repetia número depois de excluir)
function gerarNumeroOrcamento(){
  const d = new Date();
  const base = d.getFullYear().toString() + String(d.getMonth()+1).padStart(2,'0');
  let max = 0;
  Object.values(STATE.orcamentos || {}).forEach(o => {
    const m = String(o.numero || '').match(/^(\d{6})-(\d+)$/);
    if(m && m[1] === base) max = Math.max(max, Number(m[2]));
  });
  return base + "-" + (max + 1);
}
function clienteDe(o){ return (o.clienteId && STATE.clientes[o.clienteId]) || {nome:o.clienteNome, telefone:o.clienteTelefone}; }

    <input id="${prefix}-m" type="text" inputmode="numeric" maxlength="2" placeholder="MM" value="${esc(mVal || '')}" data-in="mm" aria-label="Minutos">

}
ON_INPUT.hh = el => {
  el.value = el.value.replace(/\D/g, '').slice(0, 2);

  if(h === "") return "";

}
function toLocalInput(iso){
  if(!iso) return '';
  const d = new Date(iso); const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

let LOGO_CACHE = {url:null, data:null};
// a folha usa a logo como "data:", para o PDF sair certo
async function prepararLogo(){
  const c = STATE.config || {};

    LOGO_CACHE = {url:c.logoUrl, data};

  } catch(e){ console.warn('logo', e); LOGO_CACHE = {url:c.logoUrl, data:null}; }
}

  if(c.logoData) return c.logoData;

  return null;
}
// reduz para no máximo 600x240 (cabe no armazenamento e fica leve no PDF)
function shrinkImage(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, 600 / img.width, 240 / img.height);
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/png'));
      };
      img.onerror = () => reject(new Error('imagem inválida'));
      img.src = r.result;
    };
    r.onerror = () => reject(new Error('não deu para ler o arquivo'));
    r.readAsDataURL(file);
  });
}

// ---------- backup ----------
function montarBackup(){
  const semId = col => { const o = {}; Object.values(col).forEach(d => { const c = Object.assign({}, d); delete c.id; o[d.id] = c; }); return o; };
  return { app:'OrcaTop', versao:2, exportadoEm:nowISO(), dados:{
    clientes:semId(STATE.clientes), catalogoServicos:semId(STATE.catServicos), catalogoMateriais:semId(STATE.catMateriais),
    orcamentos:semId(STATE.orcamentos), compromissos:semId(STATE.compromissos), config:{empresa:STATE.config || {}} } };
}
ACT.backup = async () => {
  const json = JSON.stringify(montarBackup(), null, 2);
  await entregarArquivo(new Blob([json], {type:'application/json'}), `backup-orcatop-${new Date().toISOString().slice(0,10)}.json`, 'Backup baixado.');
};
ON_CHANGE.restore = el => {
  const file = el.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const data = JSON.parse(r.result);
      let pacote;
      if(data && data.app === 'OrcaTop' && data.dados) pacote = data.dados;
      else if(data && Array.isArray(data.historico)) pacote = converterV1(data);
      else throw new Error('esse arquivo não é um backup do OrçaTop');
      const n = await juntarPacote(pacote);
      toast(`Backup restaurado: ${n.orcamentos} orçamento(s), ${n.clientes} cliente(s), ${n.catalogo} item(ns) de catálogo e ${n.compromissos} compromisso(s) novos.`);
      render();
    } catch(e){ toast('Não foi possível restaurar: ' + e.message); }
  };
  r.readAsText(file);
  el.value = '';
};
// junta sem apagar: só entra o que ainda não existe (mesmo id)
async function juntarPacote(p){
  const cont = {orcamentos:0, clientes:0, catalogo:0, compromissos:0};
  const mapas = [['clientes', STATE.clientes, 'clientes'], ['catalogoServicos', STATE.catServicos, 'catalogo'],
                 ['catalogoMateriais', STATE.catMateriais, 'catalogo'], ['orcamentos', STATE.orcamentos, 'orcamentos'], ['compromissos', STATE.compromissos, 'compromissos']];
  for(const [col, atual, k] of mapas){
    for(const [id, doc] of Object.entries(p[col] || {})){
      if(atual[id]) continue;
      await db.collection(col).doc(id).set(doc);
      cont[k]++;
    }
  }
  const emp = p.config && p.config.empresa;
  if(emp && !STATE.config.nomeEmpresa && Object.keys(emp).length) await db.doc('config/empresa').set(emp);
  return cont;
}
// ---------- calculadora antiga (v1, 2026-10-28) ----------
function lerV1(){
  try { const d = JSON.parse(localStorage.getItem(V1_KEY) || 'null'); return d && Array.isArray(d.historico) && d.historico.length ? d : null; }
  catch(e){ return null; }
}
function converterV1(v1){
  const out = {clientes:{}, catalogoServicos:{}, catalogoMateriais:{}, orcamentos:{}, config:{}};
  const cliIds = {};
  (v1.historico || []).forEach(h => {
    const q = h.dados || {}; const cli = q.cliente || {};
    const nome = (cli.nome || h.cliente || 'Cliente sem nome').trim();
    const key = nome.toLowerCase();
    if(!cliIds[key]){
      cliIds[key] = 'v1c-' + key.replace(/[^a-z0-9]+/g, '-').slice(0, 30) + '-' + Object.keys(cliIds).length;
      out.clientes[cliIds[key]] = {nome, telefone:cli.telefone || '', email:cli.email || '', endereco:cli.endereco || '', cpfCnpj:''};
    }
    const mult = q.margem && q.margem.ativa ? (Number(q.margem.pct) || 0) : 0;
    let servicos = [];
    if(q.modo === 'hora'){
      const hrs = Number(q.hora && q.hora.horas) || 0, ph = Number(q.hora && q.hora.valor) || 0, v = cents(hrs * ph);
      if(hrs || ph) servicos.push({id:uid(), titulo:(q.hora.descricao || 'Mão de obra'), descricao:'', quantidade:1, porHora:true,
        horaDetalhe:{modo:'estimado', horas:hrs, precoHora:ph, label:horasLabel(hrs)}, valorUnit:v, valorTotal:v});
    } else {
      servicos = (q.servicos || []).filter(s => s.name || s.price).map(s => ({id:uid(), titulo:s.name || 'Serviço', descricao:s.desc || '', quantidade:1, porHora:false, valorUnit:cents(s.price || 0), valorTotal:cents(s.price || 0)}));
    }
    const materiais = (q.materiais || []).filter(m => m.desc || m.price).map(m => {
      const it = {id:uid(), titulo:m.desc || 'Material', unidade:m.unit || 'und', quantidade:Number(m.qty) || 0, valorUnit:cents(m.price || 0), margemTipo:mult ? 'pct' : null, margemValor:mult};
      it.valorTotal = cents(matUnitFinal(it) * it.quantidade); return it;
    });
    out.orcamentos['v1-' + h.id] = {numero:String(h.numero), criadoEm:h.salvoEm || nowISO(), clienteId:cliIds[key], clienteNome:nome, clienteTelefone:cli.telefone || '',
      status:'negociacao', descricaoAtividades:q.observacoes || '', servicos, materiais, recibos:[], lembrete:null, garantiaDias:90, finalizadoEm:null};
  });
  ((v1.catalogo && v1.catalogo.servicos) || []).forEach((s, i) => { out.catalogoServicos['v1s-' + i] = {titulo:s.name, valor:s.price || 0, descricao:s.desc || ''}; });
  ((v1.catalogo && v1.catalogo.materiais) || []).forEach((m, i) => { out.catalogoMateriais['v1m-' + i] = {titulo:m.desc, unidade:m.unit || 'und', valor:m.price || 0}; });
  if(v1.empresa && v1.empresa.nome){
    out.config.empresa = {nomeEmpresa:v1.empresa.nome, telefone:v1.empresa.contato || '', validadeDias:7, garantiaDiasPadrao:90,
      logoData:(v1.empresa.logoId && v1.logos && v1.logos[v1.empresa.logoId]) || null};
  }
  return out;
}
ACT.importarV1 = async (arg, btn) => {
  const v1 = lerV1(); if(!v1) return;

  if(!titulo){ toast('Dê um nome ao item.'); return; }
  const data = kind === 's' ? {titulo, valor:cents(parseNum($('ct-valor').value)), descricao:$('ct-desc').value.trim()}
                            : {titulo, unidade:$('ct-un').value.trim() || 'und', valor:cents(parseNum($('ct-valor').value))};
  const col = db.collection(kind === 's' ? 'catalogoServicos' : 'catalogoMateriais');
  btn.disabled = true;
  try { await salvando(() => id ? col.doc(id).set(data) : col.add(data)); closeModal(); toast('Catálogo atualizado.'); }
  catch(e){ btn.disabled = false; }
};
ACT.catExcluir = async arg => {
  const [kind, id] = arg.split(':');
  if(!await confirmar({titulo:'Remover do catálogo?', texto:'Os orçamentos que já usam o item não mudam.', ok:'Remover', perigo:true})) return;
  await salvando(() => db.collection(kind === 's' ? 'catalogoServicos' : 'catalogoMateriais').doc(id).delete());
  closeModal();
};
// guarda no catálogo sem repetir (mesmo nome = atualiza)
async function salvarNoCatalogo(kind, data){
  const colName = kind === 's' ? 'catalogoServicos' : 'catalogoMateriais';
  const atual = kind === 's' ? STATE.catServicos : STATE.catMateriais;
  const igual = Object.values(atual).find(x => (x.titulo || '').trim().toLowerCase() === data.titulo.trim().toLowerCase());
  if(igual) await db.collection(colName).doc(igual.id).set(data);
  else await db.collection(colName).add(data);
}

  if($('s-pordiaria').checked){
    const dias = parseInt($('s-dias').value, 10) || 0, valorDiaria = cents(parseNum($('s-valor-diaria').value));

    return {porDiaria:true, diariaDetalhe:{dias, valorDiaria}, quantidade:1, valorUnit:total, valorTotal:total, ok: dias >= 1 && valorDiaria > 0};
  }
  if($('s-porhora').checked){
    const preco = parseNum($('s-preco-hora').value);
    let det, horas;
    if(SERV_HMODO === 'estimado'){
      horas = parseNum($('s-horas').value);
      det = {modo:'estimado', horas, precoHora:preco, label:horasLabel(horas)};
    } else {
      const inicio = getTimeField('s-inicio'), fim = getTimeField('s-fim'), pausa = parseNum($('s-pausa').value);
      const r = calcHoras(inicio, fim, pausa); horas = r.horasDecimais;
      det = {modo:'horario', inicio, fim, pausaMin:pausa, precoHora:preco, label:r.label, horas:cents(horas)};
    }
    const unit = cents(horas * preco);
    return {porHora:true, horaDetalhe:det, quantidade:qtd, valorUnit:unit, valorTotal:cents(unit * qtd), ok: horas > 0};
  }
  const v = cents(parseNum($('s-valor').value));
  return {porHora:false, quantidade:qtd, valorUnit:v, valorTotal:cents(v * qtd), ok:true};
}

/* =====================================================================
   AGENDA: semana (foco) e panorama do mês
   ===================================================================== */
const MES3 = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const SEM1 = ['D','S','T','Q','Q','S','S'];
let AGENDA_DIA = null;
function horaAgora(){ const d = new Date(); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function horaDeISO(iso){ const d = new Date(iso); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }
// já pagou tudo? (cobrança some sozinha)
function cobrancaPaga(orcId){
  const o = orcId && STATE.orcamentos[orcId]; if(!o) return false;
  const t = orcTotal(o); return t.total > 0 && t.aReceber <= 0;
}
function orcSub(o){ return o ? [o.clienteNome, o.numero ? 'nº ' + o.numero : ''].filter(Boolean).join(' · ') : ''; }
// tudo o que acontece num dia, já em ordem (com hora primeiro, depois sem hora)
function itensDoDia(dia){
  const hoje = diaHoje(), agora = horaAgora(), out = [];
  const atrasado = (d, h) => d < hoje || (d === hoje && !!h && h < agora);
  Object.values(STATE.orcamentos || {}).forEach(o => {
    const a = o.agenda;
    if(a && a.inicio && o.status !== 'perdido' && dia >= a.inicio && dia <= (a.fim || a.inicio)){
      const total = diasEntre(a.inicio, a.fim || a.inicio);
      out.push({tipo:'servico', hora:a.hora || '', titulo:(o.servicos && o.servicos[0] && o.servicos[0].titulo) || 'Serviço', sub:orcSub(o),
        orcId:o.id, compId:null, diaN: total > 1 ? diasEntre(a.inicio, dia) : null, diasTotal: total > 1 ? total : null, feito:false, atrasado:false});
    }
    const l = o.lembrete;
    if(l && l.data && diaDe(new Date(l.data)) === dia){
      const cob = l.tipo === 'cobranca', feito = !!l.concluido || (cob && cobrancaPaga(o.id)), hora = horaDeISO(l.data);
      const ar = orcTotal(o).aReceber;
      out.push({tipo: cob ? 'cobranca' : 'lembrete', hora, titulo:l.descricao || (cob ? 'Cobrança' : 'Lembrete'),
        sub:[orcSub(o), cob && ar > 0 ? 'A receber ' + fmtMoney(ar) : ''].filter(Boolean).join(' · '),
        orcId:o.id, compId:null, diaN:null, diasTotal:null, feito, atrasado: !feito && atrasado(dia, hora)});
    }
  });
  Object.values(STATE.compromissos || {}).forEach(c => {
    if(c.data !== dia) return;
    const o = c.orcamentoId && STATE.orcamentos[c.orcamentoId];
    const feito = !!c.concluido || (c.tipo === 'cobranca' && cobrancaPaga(c.orcamentoId));
    const ar = o ? orcTotal(o).aReceber : 0;
    out.push({tipo: c.tipo === 'cobranca' ? 'cobranca' : 'compromisso', hora:c.hora || '', titulo:c.titulo || 'Compromisso',
      sub:[orcSub(o), c.tipo === 'cobranca' && ar > 0 ? 'A receber ' + fmtMoney(ar) : ''].filter(Boolean).join(' · '),
      orcId:null, compId:c.id, diaN:null, diasTotal:null, feito, atrasado: !feito && atrasado(dia, c.hora)});
  });
  return out.sort((a, b) => (a.hora ? 0 : 1) - (b.hora ? 0 : 1) || a.hora.localeCompare(b.hora) || a.titulo.localeCompare(b.titulo));
}
function diasComItens(de, ate){
  const set = new Set();
  for(let d = de; d <= ate; d = somarDias(d, 1)) if(itensDoDia(d).some(i => !i.feito)) set.add(d);
  return set;
}
function fmtIntervalo(a, b){
  const da = dataDoDia(a), db_ = dataDoDia(b);
  return da.getMonth() === db_.getMonth() ? `${da.getDate()} a ${db_.getDate()} de ${MES3[db_.getMonth()]}`
    : `${da.getDate()} de ${MES3[da.getMonth()]} a ${db_.getDate()} de ${MES3[db_.getMonth()]}`;
}
const TIPO_LABEL = {servico:'Serviço', compromisso:'Compromisso', cobranca:'Cobrança', lembrete:'Lembrete'};
function itemHtml(i){
  const act = i.orcId ? `data-act="abrir" data-arg="${esc(i.orcId)}"` : `data-act="compAbrir" data-arg="${esc(i.compId)}"`;
  const extra = [i.diaN ? `dia ${i.diaN} de ${i.diasTotal}` : '', i.sub ? esc(i.sub) : ''].filter(Boolean).join(' · ');
  return `<button class="day-item tipo-${i.tipo} ${i.feito ? 'feito' : ''}" ${act}>
    <span class="hr">${i.hora ? esc(i.hora) : '—'}</span>
    <span class="body"><span class="t">${esc(i.titulo)}<span class="tag">${TIPO_LABEL[i.tipo]}</span></span>
      ${extra || i.atrasado || i.feito ? `<span class="d">${i.atrasado ? '<span class="late">Atrasado</span>' + (extra ? ' · ' : '') : ''}${i.feito ? 'Feito' + (extra ? ' · ' : '') : ''}${extra}</span>` : ''}</span>
  </button>`;
}
function renderAgenda(dia){
  AGENDA_DIA = /^\d{4}-\d{2}-\d{2}$/.test(dia || '') ? dia : diaHoje();
  const ini = inicioSemana(AGENDA_DIA), fim = somarDias(ini, 6), hoje = diaHoje();
  const ocupados = diasComItens(ini, fim), itens = itensDoDia(AGENDA_DIA);
  const semana = Array.from({length:7}, (_, k) => somarDias(ini, k));
  $('app').innerHTML = `
    <header class="topbar">
      <button class="icon-btn" data-act="go" data-arg="home" aria-label="Voltar">${ico('back')}</button>
      <div class="titles"><h1>Agenda</h1><div class="sub">${fmtIntervalo(ini, fim)}</div></div>
      <div class="wk-nav">
        <button class="icon-btn" data-act="agendaSemana" data-arg="-1" aria-label="Semana anterior">${ico('back')}</button>
        <button class="icon-btn" data-act="agendaSemana" data-arg="1" aria-label="Próxima semana" style="transform:scaleX(-1);">${ico('back')}</button>
        <button class="btn-mes" data-act="agendaMesAbrir">Mês</button>
      </div>
    </header>
    <div class="content">
      <div class="week-strip" role="group" aria-label="Dias da semana">
        ${semana.map(d => `<button class="wk-day ${d === AGENDA_DIA ? 'on' : ''} ${ocupados.has(d) ? 'has' : ''} ${d === hoje ? 'hoje' : ''}" data-act="agendaDia" data-arg="${d}" aria-label="${fmtDiaLongo(d)}">${SEM1[dataDoDia(d).getDay()]}<b>${dataDoDia(d).getDate()}</b><i></i></button>`).join('')}
      </div>
      <div class="day-title">${fmtDiaLongo(AGENDA_DIA)}${AGENDA_DIA === hoje ? ' (hoje)' : ''}</div>
      <div class="day-items">${itens.length ? itens.map(itemHtml).join('') : '<p class="empty">Nada marcado neste dia.</p>'}</div>
      <button class="btn btn-primary btn-block" data-act="compAbrir">${ico('plus')} Novo compromisso</button>
    </div>`;
}
ACT.agendaDia = d => go('agenda', d);
ACT.agendaSemana = n => go('agenda', somarDias(AGENDA_DIA || diaHoje(), 7 * Number(n)));
ACT.agendaMesAbrir = () => go('agendaMes', (AGENDA_DIA || diaHoje()).slice(0, 7));
ACT.agendaMesNav = n => {

function renderAgendaMes(ym){
  if(!/^\d{4}-\d{2}$/.test(ym || '')) ym = (AGENDA_DIA || diaHoje()).slice(0, 7);
  const [a, m] = ym.split('-').map(Number);
  const primeiro = ym + '-01', nDias = new Date(a, m, 0).getDate(), ultimo = ym + '-' + p2(nDias);
  const ocupados = diasComItens(primeiro, ultimo), hoje = diaHoje();
  const sel = AGENDA_DIA || hoje, wIni = inicioSemana(sel), wFim = somarDias(wIni, 6);
  const vazios = dataDoDia(primeiro).getDay();
  const nomeMes = MESES[m - 1].charAt(0).toUpperCase() + MESES[m - 1].slice(1) + ' ' + a;
  $('app').innerHTML = `
    ${topbar('Panorama do mês', '', 'agenda:' + sel)}
    <div class="content">
      <div class="month-head">
        <button class="icon-btn" data-act="agendaMesNav" data-arg="-1" aria-label="Mês anterior">${ico('back')}</button>
        <h2 style="font-size:17px;">${nomeMes}</h2>
        <button class="icon-btn" data-act="agendaMesNav" data-arg="1" aria-label="Próximo mês" style="transform:scaleX(-1);">${ico('back')}</button>
      </div>
      <div class="month-grid">
        ${SEM1.map(w => `<div class="wd">${w}</div>`).join('')}
        ${'<div></div>'.repeat(vazios)}
        ${Array.from({length:nDias}, (_, k) => { const d = ym + '-' + p2(k + 1);
          return `<button class="mday ${ocupados.has(d) ? 'busy' : ''} ${d === hoje ? 'hoje' : ''} ${d >= wIni && d <= wFim ? 'wk' : ''}" data-act="go" data-arg="agenda:${d}" aria-label="${fmtDiaLongo(d)}">${k + 1}</button>`; }).join('')}
      </div>
      <p class="month-leg">Dias destacados têm algo marcado. O contorno amarelo é a semana aberta. Toque num dia para ver a semana dele.</p>
    </div>`;
}

/* =====================================================================
   A FOLHA DO DOCUMENTO (prévia e PDF usam a mesma)

function renderDocumento(o, tipo, reciboIdx){
  const cfg = STATE.config || {};
  const t = orcTotal(o);
  const cli = clienteDe(o);
  const logo = logoSrc();
  const recibo = tipo === 'recibo' ? (o.recibos || [])[reciboIdx] : null;
  const dataDoc = recibo ? recibo.data : o.criadoEm;
  const coLinha = [cfg.cnpj ? 'CNPJ/CPF ' + cfg.cnpj : '', [cfg.cidade, cfg.estado].filter(Boolean).join('/')].filter(Boolean).join(' · ');

      </div>

        <div class="nr">nº ${esc(o.numero)}${recibo ? '-R' + (reciboIdx + 1) : ''}</div>
        <div class="when">${fmtDate(dataDoc)}</div>
        ${!recibo ? `<div class="when">Válido por ${o.validadeDias || cfg.validadeDias || 7} dias</div>` : ''}
      </div>
    </div>
    <div class="to">
      <div class="h">${recibo ? 'Recebido de' : 'Para'}</div>
      <div class="name">${esc(o.clienteNome) || 'Nome do cliente'}</div>
      ${cliContato ? `<div class="m">${esc(cliContato)}</div>` : ''}
      ${cfg.mostrarEndereco && cli.endereco ? `<div class="m">${esc(cli.endereco)}</div>` : ''}
      ${cfg.mostrarCpfCnpjCliente && cli.cpfCnpj ? `<div class="m">CPF/CNPJ ${esc(cli.cpfCnpj)}</div>` : ''}
    </div>
    ${servRows ? `<table><thead><tr><th>Serviço</th><th class="r" style="width:60px;">Qtd.</th><th class="r" style="width:110px;">Unitário</th><th class="r" style="width:120px;">Total</th></tr></thead><tbody>${servRows}</tbody></table>` : ''}
    ${matRows ? `<table><thead><tr><th>Material</th><th class="r" style="width:90px;">Qtd.</th><th class="r" style="width:110px;">Unitário</th><th class="r" style="width:120px;">Subtotal</th></tr></thead><tbody>${matRows}</tbody></table>` : ''}
    ${!servRows && !matRows ? `<table><tbody><tr><td style="color:var(--paper-soft);font-style:italic;">Nenhum item adicionado ainda</td></tr></tbody></table>` : ''}
    <div class="totals"><div class="tbox">
      ${matRows ? `<div class="tl"><span>Mão de obra e serviços</span><span>${fmtMoney(t.totalServicos)}</span></div><div class="tl"><span>Materiais</span><span>${fmtMoney(t.totalMateriais)}</span></div>` : ''}
      ${recibo ? `<div class="tl"><span>Total do orçamento</span><span>${fmtMoney(t.total)}</span></div>
        <div class="tl grand"><span>Valor recebido</span><span>${fmtMoney(recibo.valor)}</span></div>
        <div class="tl" style="margin-top:6px;"><span>Saldo após este pagamento</span><span>${fmtMoney(cents(t.total - recebidoAte))}</span></div>`

    ${recibo ? `<div class="stmt">Declaro, por meio deste documento, ter recebido de <b>${esc(o.clienteNome)}</b> a quantia de <b>${fmtMoney(recibo.valor)}</b>, via ${esc(recibo.forma)}, referente ao orçamento nº ${esc(o.numero)}.</div>` : ''}
    <div class="terms">
      <div>Garantia da mão de obra<b>${o.garantiaDias || cfg.garantiaDiasPadrao || 90} dias</b></div>

      ${cfg.mostrarPix && cfg.pixChave ? `<div>Chave Pix<b>${esc(cfg.pixChave)}</b></div>` : ''}
    </div>
    ${o.descricaoAtividades && !recibo ? `<div class="obs"><div class="h">Observações</div><p>${esc(o.descricaoAtividades)}</p></div>` : ''}
    ${cfg.mostrarAssinaturaEmpresa || cfg.mostrarAssinaturaCliente ? `<div class="signs">
      ${cfg.mostrarAssinaturaEmpresa ? `<div>${esc(cfg.nomeEmpresa || 'Empresa')}</div>` : ''}
      ${cfg.mostrarAssinaturaCliente ? `<div>${esc(o.clienteNome || 'Cliente')}</div>` : ''}
    </div>` : ''}
    <div class="foot">Documento gerado em ${fmtDateTime(nowISO())}</div>
  </div>`;
}
// coloca a folha (780px) dentro de um espaço menor, em escala
function montarFolha(frame, o, tipo, reciboIdx){
  frame.innerHTML = renderDocumento(o, tipo, reciboIdx);
  const fit = () => {
    const doc = frame.firstElementChild; if(!doc || !frame.isConnected) return;
    const s = Math.min(1, frame.clientWidth / 780);
    doc.style.transform = `scale(${s})`;
    frame.style.height = Math.ceil(doc.offsetHeight * s) + 'px';
  };
  fit();
  frame.querySelectorAll('img').forEach(img => img.complete || img.addEventListener('load', fit));
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
}
window.addEventListener('resize', () => document.querySelectorAll('.doc-frame').forEach(f => {
  const doc = f.firstElementChild; if(!doc) return;
  const s = Math.min(1, f.clientWidth / 780); doc.style.transform = `scale(${s})`; f.style.height = Math.ceil(doc.offsetHeight * s) + 'px';
}));
function abrirPrevia(o, tipo){
  openModal(`${sheetHead('Prévia do documento')}<p class="sub" style="margin:0 0 12px;">É assim que o cliente vai ver.</p><div class="doc-frame" id="modal-frame"></div>`, 'doc-sheet');
  montarFolha($('modal-frame'), o, tipo);
}

// ---------- PDF ----------
// fotografa a folha e corta as páginas entre as linhas da tabela, nunca no meio de um item
async function buildPdfBlob(o, tipo, reciboIdx){
  if(!window.html2canvas || !window.jspdf) throw new Error('as ferramentas de PDF não carregaram (precisa de internet)');
  const host = document.createElement('div');
  host.className = 'pdf-host';
  host.innerHTML = renderDocumento(o, tipo, reciboIdx);
  document.body.appendChild(host);
  try {
    const docEl = host.firstElementChild;
    await Promise.all([...docEl.querySelectorAll('img')].map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(docEl, {scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false});
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
    const ratio = canvas.width / docEl.offsetWidth;
    const pxPerMm = canvas.width / pageW;
    const margin = 14;
    const top = docEl.getBoundingClientRect().top;
    const breaks = [...docEl.querySelectorAll('tr, .hdr, .to, .totals, .stmt, .terms, .obs, .signs, .foot')]
      .map(el => Math.round((el.getBoundingClientRect().bottom - top) * ratio)).sort((a, b) => a - b);
    // passou só um pouco de uma página? reduz um pouco a folha e mantém tudo numa página
    const alturaMm = canvas.height / pxPerMm, cabe = pageH - margin;
    if(alturaMm > cabe && alturaMm <= cabe * 1.15){
      const k = cabe / alturaMm;
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', (pageW - pageW * k) / 2, 0, pageW * k, cabe);
      return pdf.output('blob');
    }
    let start = 0, first = true;
    while(start < canvas.height - 2){
      const topMm = first ? 0 : margin;
      const pagePx = Math.floor((pageH - topMm - margin) * pxPerMm);
      let end = Math.min(start + pagePx, canvas.height);
      if(end < canvas.height){ const fit = breaks.filter(b => b > start + 40 && b <= end); if(fit.length) end = fit[fit.length - 1]; }
      const slice = document.createElement('canvas');
      slice.width = canvas.width; slice.height = end - start;
      const ctx = slice.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, slice.width, slice.height);
      ctx.drawImage(canvas, 0, start, canvas.width, slice.height, 0, 0, canvas.width, slice.height);
      if(!first) pdf.addPage();
      pdf.addImage(slice.toDataURL('image/png'), 'PNG', 0, topMm, pageW, slice.height / pxPerMm);
      first = false; start = end;
    }
    return pdf.output('blob');
  } finally { host.remove(); }
}
function nomeArquivo(o, tipo, reciboIdx){
  const cli = (o.clienteNome || 'cliente').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase();
  return (tipo === 'recibo' ? `Recibo_${o.numero}-R${reciboIdx + 1}` : `Orcamento_${o.numero}`) + `_${cli}.pdf`;
}
let GERANDO = false;
async function gerarDocumento(o, tipo, reciboIdx){
  if(GERANDO) return; GERANDO = true;
  toast("Gerando PDF…");
  try {
    const blob = await buildPdfBlob(o, tipo, reciboIdx);
    await entregarArquivo(blob, nomeArquivo(o, tipo, reciboIdx), 'PDF pronto.');
  } catch(e){ console.error(e); toast("Não foi possível gerar o PDF: " + (e.message || e)); }
  finally { GERANDO = false; }
}
ACT.pdf = arg => {
  const [id, tipo, idx] = arg.split(':');
  const o = STATE.orcamentos[id]; if(!o) return;
  gerarDocumento(o, tipo, idx !== undefined ? Number(idx) : undefined);
};
// entrega o arquivo: no Claude pela janela de download dele; no celular pelo "compartilhar"; no computador baixando
async function entregarArquivo(blob, filename, okMsg){
  if(downloadsCap){
    try { await downloadsCap.save({filename, data:blob}); toast(okMsg); return; }
    catch(e){ if(e && e.code === 'declined') return; console.warn('downloads', e); }
  }
  try {
    const file = new File([blob], filename, {type:blob.type});
    if(MODO === 'local' && navigator.canShare && navigator.canShare({files:[file]}) && /Android|iPhone|iPad/i.test(navigator.userAgent)){
      await navigator.share({files:[file], title:filename}); return;
    }
  } catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(okMsg);
}

function monthKey(iso){ const d = new Date(iso); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){ const [y, m] = key.split('-'); return ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][Number(m)-1] + "/" + y.slice(2); }
function moneyShort(v){ return v >= 1000 ? (v/1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + " mil" : Math.round(v).toString(); }
function svgBarChart(data){
  const w = 340, h = 190, padB = 26, padT = 22, padX = 6;
  const max = Math.max(1, ...data.map(d => d.value));
  const slot = (w - padX*2) / (data.length || 1), barW = Math.min(34, slot * 0.55);
  const base = h - padB;
  const bars = data.map((d, i) => {
    const bh = (d.value / max) * (base - padT);
    const x = padX + i*slot + (slot - barW)/2, y = base - bh;
    const last = i === data.length - 1;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${Math.max(bh, d.value > 0 ? 2 : 0)}" rx="3" fill="${last ? 'var(--accent)' : 'var(--line-strong)'}"></rect>
      ${d.value > 0 ? `<text x="${x + barW/2}" y="${y - 6}" font-size="10" text-anchor="middle" fill="var(--ink)" font-weight="${last ? 700 : 400}">${moneyShort(d.value)}</text>` : ''}
      <text x="${x + barW/2}" y="${h - 8}" font-size="10" text-anchor="middle" fill="var(--ink-soft)">${d.label}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Recebido nos últimos 6 meses"><line x1="0" x2="${w}" y1="${base + 0.5}" y2="${base + 0.5}" stroke="var(--line-strong)" stroke-width="1"></line>${bars}</svg>`;
}
function renderRelatorios(){
  const orcs = Object.values(STATE.orcamentos);
  const now = new Date(), keys = [];
  for(let i = 5; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1); keys.push(d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0')); }
  const porMes = {}; keys.forEach(k => porMes[k] = 0);
  orcs.forEach(o => (o.recibos || []).forEach(r => { const k = monthKey(r.data); if(k in porMes) porMes[k] = cents(porMes[k] + Number(r.valor || 0)); }));
  const chartData = keys.map(k => ({label:monthLabel(k), value:porMes[k]}));
  const mesAtual = keys[keys.length - 1];
  const emAberto = orcs.filter(o => o.status !== 'perdido').reduce((s, o) => s + Math.max(0, orcTotal(o).aReceber), 0);
  const fechados = orcs.filter(o => ['aprovado','execucao','finalizado'].includes(o.status)).length;
  const decididos = orcs.filter(o => ['aprovado','execucao','finalizado','perdido'].includes(o.status)).length;
  $('app').innerHTML = `
    ${topbar("Relatórios", "", "home")}
    <div class="content">
      <div class="stats">
        <div class="stat"><div class="sub">Recebido em ${monthLabel(mesAtual)}</div><div class="v num">${fmtMoney(porMes[mesAtual])}</div></div>
        <div class="stat"><div class="sub">Total a receber</div><div class="v num">${fmtMoney(emAberto)}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Recebido nos últimos 6 meses</h2></div>
        ${svgBarChart(chartData)}
        <p class="hint">Soma dos recibos emitidos em cada mês.</p>
      </div>
      <div class="card">
        <div class="card-head"><h2>Orçamentos por etapa</h2>${decididos ? `<span class="sub">${Math.round(fechados / decididos * 100)}% fechados</span>` : ''}</div>
        <div class="items">${STATUS_ORDER.map(s => `<div class="item-row" style="align-items:center;"><div><span class="pill st-${s}">${STATUS_LABEL[s]}</span></div><div class="item-val">${orcs.filter(o => o.status === s).length}</div></div>`).join("")}</div>
        ${decididos ? `<p class="hint">"Fechados" conta aprovados, em execução e finalizados, entre os que já tiveram resposta (perdidos incluídos).</p>` : ''}
      </div>
    </div>`;
}
